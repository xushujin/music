name: Build Release APK

# 推送 main 分支时自动编译可安装的 release APK，并作为 Artifact 上传。
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 37 / build-tools 36)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      # 签名密钥（决定 APK 能否安装）：
      # 方式 A（推荐）：在仓库 Settings → Secrets → Actions 配置 KEYSTORE_BASE64
      #   （本地执行 base64 -i keystore/lightmusic-release.jks 得到），
      #   APK 用你本地同一个 keystore 签名 → 版本更新可正常覆盖安装。
      # 方式 B（零配置兜底）：没配密钥时，自动用 Android debug keystore 签名，
      #   APK 一样可安装；但每次 CI 密钥不同，覆盖安装前需先卸载旧包。
      - name: Decode keystore from secret (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-key.jks"
          echo "KEYSTORE_PATH=${{ github.workspace }}/release-key.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'lightmusic' }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'lightmusic' }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'lightmusic' }}" >> "$GITHUB_ENV"

      - name: Generate debug keystore (fallback when no secret)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lightmusic-release-apk
          path: app/build/outputs/apk/release/*.apk
