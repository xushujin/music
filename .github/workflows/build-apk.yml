name: Build Release APK

# 只在打 tag 时自动编译，例如：
#   git tag v1.0 && git push origin v1.0
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
#
# 两个踩过的坑（别再犯）：
# 1) GitHub 的 if: 表达式里**不能**用 secrets 上下文（会报
#    "Unrecognized named-value: 'secrets'"）。所以「有没有配签名密钥」的判断
#    放到 shell 里做，secrets 只通过 env 注入。
# 2) 不用 android-actions/setup-android：它在 cmdline-tools 16.0 上会去装早已
#    下线的 legacy "tools" 包，`sdkmanager tools` 直接 exit code 1 让整个 job 挂掉。
#    GitHub 的 ubuntu runner 本来就预装了完整 Android SDK，直接用即可。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 把 APK 挂到 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 放到 job 级：下面的 if 需要用它判断（if 里不能直接用 secrets 上下文）。
      # 未配置时是空字符串，走 debug keystore 兜底。
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 直接用 runner 预装的 Android SDK（镜像已把 ANDROID_HOME 设为
      # /usr/local/lib/android/sdk），只补装我们需要的几个包。
      # 平台包名必须带 .0：仓库里只有 platforms;android-37.0 / 37.1 / 37.2，
      # **不存在** platforms;android-37，写了会 "Failed to find package" 退出码 1。
      # build-tools 保持 36.0.0（仓库稳定版，本机验证与 compileSdk 37 + AGP 9.4.1 兼容）。
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # 优先用 cmdline-tools/latest，没有就取版本号最大的那个目录
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      # 签名密钥决定 APK 能否安装，两条路径：
      #   方式 A（推荐）：仓库 Settings → Secrets → Actions 配 KEYSTORE_BASE64
      #     （本地执行 base64 -i keystore/lightmusic-release.jks 得到）
      #     用与你本地同一个 keystore 签名 → 版本更新可直接覆盖安装
      #   方式 B（零配置兜底）：没配就自动生成 Android debug keystore 签名
      #     APK 一样能装，但每次 CI 密钥不同，覆盖安装前需先卸载旧包
      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-key.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-lightmusic}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-lightmusic}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-lightmusic}" >> "$GITHUB_ENV"
            echo "签名：使用仓库 Secret 里的 keystore（与本地构建同一把钥匙）"
          else
            mkdir -p "$HOME/.android"
            if [ -f "$HOME/.android/debug.keystore" ]; then
              echo "复用 runner 上已有的 debug keystore"
            else
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            # 这个兜底签名每次构建都是新钥匙，产出的 APK 与用别的密钥签名的安装
            # 无法互相覆盖（装新版会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
            # 想固定签名就在仓库 Settings → Secrets → Actions 配 KEYSTORE_BASE64。
            echo "::warning title=未配置签名密钥::未设置 KEYSTORE_BASE64，本次用临时 debug keystore 签名。这样产出的 APK 无法覆盖安装用其它密钥签名的版本（会报签名冲突），反之亦然。要固定签名请配置 KEYSTORE_BASE64。"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # 把签名指纹打进日志：以后出现「签名冲突」时，直接对比这里的指纹就能定位
      - name: Show APK signer
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "产物: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -4

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: lightmusic-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 把 APK 挂到 GitHub Release。只在 tag 构建时执行：
      # 手动触发（workflow_dispatch）没有 tag，创建不了 Release，只出 artifact。
      # 用 runner 自带的 gh CLI（不引第三方 action）；已存在同名 Release 就覆盖资源。
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # 附件名必须纯 ASCII：GitHub 会删掉 Release 资源名里的非 ASCII 字符，
          # 之前用「轻响-LightMusic-...apk」被削成了「-LightMusic-...apk」（多了个前导横线）。
          ASSET="LightMusic-${TAG}.apk"
          # 用通配取产物：签名时叫 app-release.apk，未签名时叫 app-release-unsigned.apk
          APK_SRC="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "上传 $APK_SRC -> $ASSET"
          cp "$APK_SRC" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖资源"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$ASSET" --title "轻响 $TAG" --generate-notes
          fi
          gh release view "$TAG" --json url,tagName,assets
